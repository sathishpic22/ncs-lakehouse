name: Lakehouse CI & Data Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17 (Required by PySpark)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyspark delta-spark pytest

    - name: Step 1 - Run Bronze Ingestion
      run: python 01_ingest_bronze.py

    - name: Step 2 - Run Silver Delta Processing
      run: python 02_transform_silver.py

    - name: Step 3 - Run Incremental Merge
      run: python 03_incremental_merge.py

    - name: Step 4 - Build Gold Star Schema Marts
      run: python 04_build_gold.py

    - name: Step 5 - Execute Automated Quality Tests
      run: pytest tests/